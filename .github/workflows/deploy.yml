name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Trigger Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 130.210.41.114
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: /home/ubuntu/deploy.sh

